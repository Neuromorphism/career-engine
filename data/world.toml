# Shared world balance data. These are authored game units, not measured productivity.
[scenario]
id = "founders-settlement"
name = "Founders’ World"
baseline_population = 500
baseline_coverage = 0.15
facility_capacity = 0.65
reliability = 0.85
competence_mastery = 10000
experience_bonus_per_milestone = 0.015
experience_bonus_cap = 0.15

[capabilities.clinical]
label = "Clinical practice"

[capabilities.nursing]
label = "Nursing"

[capabilities.design]
label = "Engineering design"

[capabilities.construction]
label = "Construction"

[capabilities.maintenance]
label = "Maintenance"

[capabilities.teaching]
