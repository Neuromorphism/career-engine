# Shared world balance data. These are authored game units, not measured productivity.
[scenario]
id = "founders-settlement"
name = "Founders’ World"
baseline_population = 500
baseline_coverage = 0.15
facility_capacity = 0.65
reliability = 0.85
competence_mastery = 10000
research_bonus_per_choice = 0.02
research_bonus_cap = 0.10
mentoring_bonus_per_choice = 0.01
mentoring_bonus_cap = 0.05

[capabilities.clinical]
label = "Clinical practice"

[capabilities.nursing]
label = "Nursing"

[capabilities.design]
label = "Engineering design"

[capabilities.construction]
label = "Construction"

[capabilities.maintenance]
label = "Maintenance"

[capabilities.teaching]
label = "Teaching"

[capabilities.research]
label = "Research"

[capabilities.logistics]
label = "Logistics"

[capabilities.food]
label = "Food production"

[capabilities.care]
label = "Care and support"

[capabilities.governance]
label = "Coordination and governance"

[capabilities.culture]
label = "Culture and communication"

[capabilities.electrical]
label = "Electrical systems"

[capabilities.water]
label = "Water systems"

[[services]]
id = "health"
name = "Health"
description = "Care access and a coordinated clinical workforce."
requirements = { clinical = 0.35, nursing = 0.2, care = 0.15 }

[[services]]
id = "learning"
name = "Learning"
description = "Teaching, investigation, and sustained learning opportunities."
requirements = { teaching = 0.45, research = 0.15 }

[[services]]
id = "infrastructure"
name = "Infrastructure"
description = "Design, construction, maintenance, and reliable utility systems."
requirements = { design = 0.2, construction = 0.2, maintenance = 0.15, electrical = 0.1, water = 0.1 }

[[services]]
id = "livelihoods"
name = "Livelihoods"
description = "Food, logistics, and dependable organizational work."
requirements = { food = 0.2, logistics = 0.25, governance = 0.2 }

[[services]]
id = "resilience"
name = "Resilience"
description = "Preparedness, repairs, emergency care, and coordinated response."
requirements = { clinical = 0.1, maintenance = 0.2, logistics = 0.2, governance = 0.15 }

[[services]]
id = "community"
name = "Community well-being"
description = "Everyday care, culture, communication, and trustworthy institutions."
requirements = { care = 0.3, culture = 0.3, governance = 0.15 }

